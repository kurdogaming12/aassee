<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WoW Bot — Login</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet" />
</head>
<body>

<nav>
  <div class="nav-inner">
    <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
    <a href="/" class="nav-logo">
      <img src="/avatar.png" class="nav-avatar-sm" alt="WoW" />
      <span>WoW</span>
    </a>
    <div class="nav-right" id="nav-right"></div>
    <div class="nav-links" id="nav-links">
      <a href="/" data-page="home">🏠 Home</a>
      <a href="/top" data-page="top">🏆 Top</a>
      <a href="/report" data-page="report">📋 Report</a>
      <a href="/dashboard" data-page="dashboard">👤 Dashboard</a>
    </div>
  </div>
</nav>

<div class="login-page">
  <div class="login-card">
    <img src="/avatar.png" alt="WoW Bot" class="login-avatar" />
    <h1>WoW Bot</h1>
    <p class="login-sub">Sign in with Discord to view your profile,<br>check your stats and submit reports.</p>

    <a id="login-btn" href="#" class="btn discord">
      <svg class="discord-icon" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/>
      </svg>
      Login with Discord
    </a>

    <div class="login-divider">or</div>
    <a href="/" class="login-back">← Back to Home</a>

    <div class="login-features">
      <span class="login-feature">📊 View your stats</span>
      <span class="login-feature">📋 Submit reports</span>
      <span class="login-feature">🎒 See inventory</span>
    </div>
  </div>
</div>

<script src="/js/config.js"></script>
<script src="/js/nav.js"></script>
<script>
document.getElementById('login-btn').href = DISCORD_LOGIN_URL;
document.addEventListener('navReady', e => {
  if (e.detail.loggedIn) window.location.href = '/dashboard';
});
</script>
</body>
</html>
