[build]
  publish = "."

[[redirects]]
  from = "/auth/callback"
  to   = "/auth/callback.html"
  status = 200

[[redirects]]
  from = "/login"
  to   = "/login.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to   = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/top"
  to   = "/top.html"
  status = 200

[[redirects]]
  from = "/commands"
  to   = "/commands.html"
  status = 200

[[redirects]]
  from = "/features"
  to   = "/features.html"
  status = 200

[[redirects]]
  from = "/premium"
  to   = "/premium.html"
  status = 200

[[redirects]]
  from = "/report"
  to   = "/report.html"
  status = 200

[[redirects]]
  from = "/owner"
  to   = "/owner.html"
  status = 200

[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
