[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/auth/*"
  to = "https://sszip--ioqvhes.replit.app/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://sszip--ioqvhes.replit.app/api/:splat"
  status = 200
  force = true
