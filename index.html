<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WoW Bot</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    /* ── HOME REDESIGN ── */
    body { overflow-x: hidden; }

    .home-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #0a1208;
      overflow: hidden;
      pointer-events: none;
    }
    .home-bg::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(34,197,94,0.18) 0%, transparent 70%);
      top: -100px; left: -150px;
      filter: blur(60px);
    }
    .home-bg::after {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(22,163,74,0.12) 0%, transparent 70%);
      bottom: -50px; right: -100px;
      filter: blur(80px);
    }
    .home-bg-mid {
      position: absolute;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(74,222,128,0.06) 0%, transparent 70%);
      top: 50%; left: 60%;
      transform: translate(-50%, -50%);
      filter: blur(90px);
    }

    .home-page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px 40px;
    }

    .hero-card {
      background: rgba(15, 30, 16, 0.6);
      border: 1px solid rgba(74,222,128,0.2);
      border-radius: 28px;
      padding: 56px 60px;
      text-align: center;
      max-width: 560px;
      width: 100%;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 0 80px rgba(34,197,94,0.08), 0 20px 60px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }
    .hero-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(74,222,128,0.04) 0%, transparent 50%);
      pointer-events: none;
    }

    .hero-avatar-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 28px;
    }
    .hero-avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(74,222,128,0.8);
      box-shadow:
        0 0 0 6px rgba(74,222,128,0.12),
        0 0 40px rgba(74,222,128,0.5),
        0 0 80px rgba(34,197,94,0.25);
      position: relative;
      z-index: 1;
    }
    .hero-avatar-glow {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(74,222,128,0.3) 0%, transparent 70%);
      animation: pulse-glow 3s ease-in-out infinite;
      z-index: 0;
    }
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }

    .hero-title {
      font-size: 5rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: transparent;
      background: linear-gradient(135deg, #4ade80 0%, #22c55e 40%, #86efac 100%);
      -webkit-background-clip: text;
      background-clip: text;
      text-shadow: none;
      filter: drop-shadow(0 0 30px rgba(74,222,128,0.6)) drop-shadow(0 0 60px rgba(34,197,94,0.3));
      margin-bottom: 16px;
      line-height: 1;
    }

    .hero-sub {
      font-size: 1.05rem;
      color: rgba(255,255,255,0.75);
      margin-bottom: 36px;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    .hero-buttons {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-invite {
      background: linear-gradient(135deg, #22c55e, #4ade80);
      color: #0a1208;
      font-weight: 800;
      font-size: 0.9rem;
      padding: 14px 32px;
      border-radius: 50px;
      text-decoration: none;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 24px rgba(34,197,94,0.4);
    }
    .btn-invite:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(34,197,94,0.5);
    }

    .btn-server {
      background: rgba(255,255,255,0.07);
      color: #fff;
      font-weight: 800;
      font-size: 0.9rem;
      padding: 14px 32px;
      border-radius: 50px;
      text-decoration: none;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.15);
      transition: transform 0.2s, background 0.2s;
    }
    .btn-server:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.12);
    }

    /* Stats row below card */
    .home-stats {
      display: flex;
      gap: 0;
      justify-content: center;
      margin-top: 32px;
      max-width: 400px;
      width: 100%;
    }
    .home-stat {
      flex: 1;
      text-align: center;
      position: relative;
    }
    .home-stat + .home-stat::before {
      content: '';
      position: absolute;
      left: 0; top: 15%; bottom: 15%;
      width: 1px;
      background: rgba(74,222,128,0.2);
    }
    .home-stat-num {
      display: block;
      font-size: 1.6rem;
      font-weight: 900;
      color: #4ade80;
      letter-spacing: -0.03em;
    }
    .home-stat-label {
      display: block;
      font-size: 0.72rem;
      color: rgba(134,239,172,0.7);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
      margin-top: 2px;
    }

    /* Nav overrides for home */
    nav {
      background: rgba(10,18,8,0.7) !important;
    }

    @media (max-width: 600px) {
      .hero-card { padding: 40px 28px; }
      .hero-title { font-size: 3.8rem; }
      .hero-avatar { width: 110px; height: 110px; }
    }
  </style>
</head>
<body>

<div class="home-bg"><div class="home-bg-mid"></div></div>

<nav>
  <div class="nav-inner">
    <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
    <a href="/" class="nav-logo">
      <img src="/avatar.png" class="nav-avatar-sm" alt="WoW" />
      <span>WoW</span>
    </a>
    <div class="nav-right" id="nav-right"></div>
    <div class="nav-links" id="nav-links">
      <a href="/" data-page="home">🏠 Home</a>
      <a href="/top" data-page="top">🏆 Top</a>
      <a href="/report" data-page="report">📋 Report</a>
      <a href="/dashboard" data-page="dashboard">👤 Dashboard</a>
    </div>
  </div>
</nav>

<div class="home-page">
  <div class="hero-card">
    <div class="hero-avatar-wrap">
      <div class="hero-avatar-glow"></div>
      <img src="/avatar.png" alt="WoW Bot" class="hero-avatar" />
    </div>

    <h1 class="hero-title">WOW</h1>
    <p class="hero-sub">The best Economy bot you can trust</p>

    <div class="hero-buttons">
      <a href="https://discord.com/oauth2/authorize?client_id=1435231049033584722&permissions=8&integration_type=0&scope=bot"
         class="btn-invite" target="_blank">INVITE BOT</a>
      <a href="https://discord.gg/MYQGvfau4G"
         class="btn-server" target="_blank">SERVER LINK</a>
    </div>
  </div>

  <div class="home-stats">
    <div class="home-stat">
      <span class="home-stat-num" id="stat-servers">…</span>
      <span class="home-stat-label">Servers</span>
    </div>
    <div class="home-stat">
      <span class="home-stat-num" id="stat-users">…</span>
      <span class="home-stat-label">Users</span>
    </div>
    <div class="home-stat">
      <span class="home-stat-num" id="stat-status" style="color:#22c55e">●</span>
      <span class="home-stat-label">Online</span>
    </div>
  </div>
</div>

<script src="/js/config.js"></script>
<script src="/js/nav.js"></script>
<script>
async function loadStats() {
  try {
    const data = await fetch(`${BOT_API_URL}/api/stats`, { signal: AbortSignal.timeout(5000) }).then(r => r.json());
    document.getElementById('stat-servers').textContent = data.guilds ?? '—';
    document.getElementById('stat-users').textContent   = data.users  ?? '—';
    document.getElementById('stat-status').textContent  = data.online ? '●' : '○';
    document.getElementById('stat-status').style.color  = data.online ? '#22c55e' : '#ef4444';
  } catch {
    document.getElementById('stat-servers').textContent = '—';
    document.getElementById('stat-users').textContent   = '—';
    document.getElementById('stat-status').textContent  = '●';
    document.getElementById('stat-status').style.color  = '#22c55e';
  }
}
loadStats();
</script>
</body>
</html>
