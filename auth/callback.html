<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logging in…</title>
  <style>
    body { margin: 0; background: #0d0f1a; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Segoe UI', sans-serif; color: #fff; flex-direction: column; gap: 16px; }
    .spinner { width: 48px; height: 48px; border: 4px solid #ffffff22; border-top-color: #7289da; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #aaa; font-size: 14px; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Logging in with Discord…</p>
  <script>
    const BOT_URL = 'https://sszip--ioqvhes.replit.app';

    (async () => {
      const params = new URLSearchParams(window.location.search);
      const code  = params.get('code');
      const error = params.get('error');

      if (error || !code) {
        window.location.href = '/';
        return;
      }

      try {
        // Try the modern token-based exchange first
        const res  = await fetch(`${BOT_URL}/auth/exchange?code=${encodeURIComponent(code)}`, {
          signal: AbortSignal.timeout(8000)
        });

        // If the server returned non-JSON (e.g. 404 HTML), this will throw
        const text = await res.text();
        let data;
        try { data = JSON.parse(text); } catch { throw new Error('not_json'); }

        if (data.token) {
          localStorage.setItem('wow_auth_token', data.token);
          window.location.href = '/dashboard';
          return;
        }
        throw new Error(data.error || 'no_token');

      } catch (e) {
        // Fallback: redirect browser directly to the bot's /auth/callback.
        // The bot exchanges the code server-side using the correct redirect_uri
        // and then sends the user to its own /dashboard with a working session.
        window.location.href = `${BOT_URL}/auth/callback?code=${encodeURIComponent(code)}`;
      }
    })();
  </script>
</body>
</html>
