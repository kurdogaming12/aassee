<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logging in…</title>
  <style>
    body { margin: 0; background: #0d0f1a; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Segoe UI', sans-serif; color: #fff; flex-direction: column; gap: 16px; }
    .spinner { width: 48px; height: 48px; border: 4px solid #ffffff22; border-top-color: #7289da; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #aaa; font-size: 14px; }
    .error { color: #ef4444; font-size: 14px; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p id="msg">Logging in with Discord…</p>
  <script>
    const BOT_API_URL = 'https://sszip--ioqvhes.replit.app';

    (async () => {
      const params = new URLSearchParams(window.location.search);
      const code  = params.get('code');
      const error = params.get('error');

      if (error || !code) {
        window.location.href = '/';
        return;
      }

      try {
        const res  = await fetch(`${BOT_API_URL}/auth/exchange?code=${encodeURIComponent(code)}`);
        const data = await res.json();

        if (data.token) {
          localStorage.setItem('wow_auth_token', data.token);
          window.location.href = '/dashboard';
        } else {
          document.getElementById('msg').className = 'error';
          document.getElementById('msg').textContent = 'Login failed: ' + (data.error || 'Unknown error');
          setTimeout(() => { window.location.href = '/'; }, 3000);
        }
      } catch (e) {
        document.getElementById('msg').className = 'error';
        document.getElementById('msg').textContent = 'Connection error. Redirecting…';
        setTimeout(() => { window.location.href = '/'; }, 3000);
      }
    })();
  </script>
</body>
</html>
